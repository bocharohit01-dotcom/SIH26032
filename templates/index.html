<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KisanSeva - Intelligent Agricultural Procurement Coordination & Slot Scheduling Platform.">
    <title>KisanSeva — Procurement & Slot Scheduling Platform</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Outfit', 'sans-serif']
            },
            colors: {
              emerald: {
                50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0',
                300:'#6ee7b7', 400:'#34d399', 500:'#10b981',
                600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b', 950:'#022c22'
              }
            }
          }
        }
      }
    </script>

    <!-- Visual Demo Theme Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Fast Production Local React Libraries (No Babel Overhead) -->
    <script src="/static/js/vendor/react.production.min.js"></script>
    <script src="/static/js/vendor/react-dom.production.min.js"></script>

    <style>
      /* Demo theme body overrides */
      body {
        background-color: #f0fdf4 !important;
        color: #0f172a !important;
      }

      /* Tailwind prose & animation utilities */
      @keyframes fadeIn {
        from { opacity:0; transform:translateY(6px); }
        to   { opacity:1; transform:translateY(0); }
      }
      .animate-fade-in { animation: fadeIn 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }

      /* Visual Demo corner ribbon */
      .vd-corner-ribbon {
        position: fixed;
        top: 0; right: 0; z-index: 9999;
        width: 0; height: 0;
        border-style: solid;
        border-width: 0 76px 76px 0;
        border-color: transparent #059669 transparent transparent;
      }
      .vd-corner-ribbon span {
        position: fixed;
        top: 16px; right: 4px;
        color: white; font-size: 8px; font-weight: 900;
        font-family: 'Inter', sans-serif;
        letter-spacing: .08em;
        transform: rotate(45deg);
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      }

      /* Instant Loading Splash Animations */
      @keyframes splashSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes splashPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>

<!-- Light-mode body -->
<body class="bg-green-50 text-slate-900 min-h-screen">

    <!-- Visual Demo Corner Badge -->
    <div class="vd-corner-ribbon"><span>DEMO</span></div>

    <!-- React App Mounting Point with Instant HTML Splash Screen -->
    <div id="root">
        <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(135deg,#f0fdf4,#dcfce7); font-family:'Inter',sans-serif; text-align:center; padding:24px;">
            <div style="width:76px; height:76px; border-radius:22px; background:linear-gradient(135deg,#059669,#0d9488); color:white; display:flex; align-items:center; justify-content:center; font-size:38px; margin-bottom:20px; box-shadow:0 14px 32px rgba(5,150,105,0.35); animation:splashPulse 2s infinite ease-in-out;">
                🌾
            </div>
            <h1 style="font-family:'Outfit',sans-serif; font-weight:900; font-size:26px; color:#0f172a; margin:0 0 6px; letter-spacing:-0.02em;">
                KisanSeva
            </h1>
            <p style="color:#059669; font-weight:700; font-size:13px; margin:0 0 28px; letter-spacing:0.04em;">
                State Agricultural Procurement Coordination Platform
            </p>
            <div style="display:flex; align-items:center; gap:12px; background:white; padding:12px 24px; border-radius:99px; border:1.5px solid #bbf7d0; boxShadow:0 6px 20px rgba(0,0,0,0.06);">
                <span style="width:20px; height:20px; border:3px solid #059669; border-top-color:transparent; border-radius:50%; display:inline-block; animation:splashSpin 0.75s linear infinite;"></span>
                <span style="font-size:13px; font-weight:800; color:#1e293b;">Loading KisanSeva Platform…</span>
            </div>
        </div>
    </div>

    <!-- Pre-compiled Production Bundle (Instant Load Time) -->
    <script src="/static/js/dist/bundle.js"></script>

</body>
</html>
